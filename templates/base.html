<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AbhyasAI{% endblock %}</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="main-header">
        <nav class="nav-container">
            <a href="/" class="logo-link">
                <span class="logo-text">Abhyas<span class="logo-highlight">AI</span></span>
            </a>
            <ul class="nav-links">
                <li><a href="/learning/learn">Learning</a></li>
                <li><a href="/exam/">Exams</a></li>
                <li><a href="/viva/">Viva Voce</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 AbhyasAI. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
